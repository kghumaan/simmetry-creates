<head>

<meta name="description" content="Fine jewelry and bespoke woodwork from the studio of Ashish Savani." />

<!-- Open Graph / link-share preview. Defaults are for the home page;
     js/share.jsx rewrites these on every route change. -->
<meta property="og:site_name" content="Simmetry.Creates" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Simmetry.Creates" />
<meta property="og:description" content="Fine jewelry and bespoke woodwork from the studio of Ashish Savani." />
<meta property="og:image" content="assets/emblem-jewelry.png" />
<meta property="og:image:alt" content="Simmetry.Creates emblem" />

<meta name="twitter:description" content="Fine jewelry and bespoke woodwork from the studio of Ashish Savani." />

<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/components.css" />
<link rel="stylesheet" href="styles/app.css" />
<link rel="stylesheet" href="styles/pages.css" />

<script>
  // First-paint mode: respect URL, else localStorage. Avoids cream→olive flash.
  (function () {
    var hash = location.hash || '#/';
    var path = hash.replace(/^#/, '') || '/';
    var mode = 'jewelry';
    if (/^\/(ww|woodwork)(\/|$)/.test(path)) mode = 'woodwork';
    else if (/^\/jewelry(\/|$)/.test(path)) mode = 'jewelry';
    // Home (`/`) always opens in jewelry; ignore localStorage there.
    document.documentElement.setAttribute('data-mode', mode);
  })();
</script>

<style>
  /* Tiny pre-React shell so the page doesn't blink white before mount */
  body { background: var(--bg); }
  #root { min-height: 100vh; }
</style>
</head>
<body>

<div id="root"></div>
