     js/share.jsx rewrites these on every route change. -->

<link rel="stylesheet" href="/styles/admin.css" />

<script>
  // Path normalization before anything renders:
  //  - legacy hash routes (#/ww/about) become clean paths (/woodwork/about)
  //  - bare `/` and /index.html land on /jewelry
  //  - /ww aliases collapse into /woodwork
  // Then first-paint mode + favicon come from the final path, avoiding a
  // cream→olive flash on woodwork pages.
  (function () {
    var path = location.pathname || '/';
    var hash = location.hash || '';
    if (/^#\//.test(hash)) {
      path = hash.slice(1);
      hash = '';
    }
    path = path.replace(/^\/index\.html$/, '/');
    path = path.replace(/^\/(ww|woodwork)(\/|$)/, '/woodwork$2');
    if (path.length > 1) path = path.replace(/\/+$/, '') || '/';
    if (path === '/') path = '/jewelry';
    if (path !== location.pathname || location.hash) {
      history.replaceState({}, '', path + location.search + (hash || ''));
    }
    var mode = /^\/woodwork(\/|$)/.test(path) ? 'woodwork' : 'jewelry';
    document.documentElement.setAttribute('data-mode', mode);
    var fav = document.getElementById('smy-favicon');
    if (fav) fav.href = '/assets/favicon-' + mode + '.png';
  })();
</script>

<style>
  /* Tiny pre-React shell so the page doesn't blink white before mount */
  body { background: var(--bg); }
  #root { min-height: 100vh; }
</style>
</head>
<body>

<div id="root"></div>
